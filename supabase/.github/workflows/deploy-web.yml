name: Deploy web MVP to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Safety net: if apps/mobile has no web/ folder yet, generate it (index.html, manifest, icons).
      # Commit the generated web/ folder to the repo so builds are reproducible.
      - name: Add web platform if missing
        run: |
          if [ ! -d web ]; then
            flutter create . --platforms=web --project-name khon_kaen_night
          fi

      - name: Write env.json from GitHub Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "Secret SUPABASE_URL is empty"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "Secret SUPABASE_ANON_KEY is empty"; exit 1; }
          # These key names must match what lib/core/env.dart reads with String.fromEnvironment.
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key}' > env.json

      - run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build web
        run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --pwa-strategy=none
          --dart-define-from-file=env.json

      # GitHub Pages cannot rewrite deep links; serving index.html as 404.html keeps them working.
      - name: SPA fallback
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
